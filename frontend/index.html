<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script src="/js/theme-init.js"></script>
    <title>Folio — Library Management System</title>
    <meta
      name="description"
      content="Folio physical collection catalogue, circulation desk, member portal, and administrative ledger."
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header" id="site-header">
      <div class="header-inner">
        <a class="site-logo" href="#catalogue">
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
          </svg>
          <span class="brand-wordmark">Folio</span>
          <span class="brand-sub">Library Desk</span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <button
            class="menu-button"
            type="button"
            popovertarget="site-menu"
            popovertargetaction="toggle"
            aria-controls="site-menu"
          >
            <svg
              aria-hidden="true"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="4" y1="6" x2="20" y2="6" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="18" x2="20" y2="18" />
            </svg>
            <span>Menu</span>
          </button>

          <ul id="site-menu" class="site-menu" popover="auto"></ul>
        </nav>

        <div class="header-account" id="header-account"></div>
      </div>
    </header>

    <main id="main-content" class="page-main" tabindex="-1">
      <div id="app-view" class="container"></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          Folio Library System &middot; Physical Circulation &amp; Catalogue &middot;
          <a href="/api/docs" target="_blank" rel="noopener">API Reference (Swagger)</a>
        </p>
        <p class="mono-meta" id="footer-status">UTC Timestamps</p>
      </div>
    </footer>

    <!-- Dedicated persistent toast region -->
    <div id="toast-region" class="toast-region" role="region" aria-label="Notifications"></div>
    <p class="visually-hidden">Screen reader notifications</p>
    <div id="toast-live-fallback" class="visually-hidden" aria-live="polite"></div>

    <!-- Shared native modal dialog -->
    <dialog id="app-dialog" aria-labelledby="app-dialog-title">
      <div class="dialog-shell">
        <div class="dialog-head">
          <h1 id="app-dialog-title" class="dialog-title">Dialog</h1>
          <button
            type="button"
            class="icon-btn"
            id="app-dialog-close"
            aria-label="Close dialog"
          >
            <svg
              aria-hidden="true"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div id="app-dialog-body" class="dialog-body"></div>
      </div>
    </dialog>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
